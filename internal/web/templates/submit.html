<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorty - URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        async function shortenLink(event) {
            event.preventDefault();
            const url = document.getElementById("urlInput").value;
            const resultEl = document.getElementById("result");

            resultEl.innerHTML = "Processing...";

            const res = await fetch("/link", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ url }),
            });

            const data = await res.json();

            if (res.ok && data.data) {
                resultEl.innerHTML = `
          <p class="text-green-600">Shortened URL:</p>
          <a class="text-blue-600 underline" href="http://${data.data}" target="_blank">http://${data.data}</a>
        `;
            } else {
                resultEl.innerHTML = `<p class="text-red-600">Error: ${data.message || 'Something went wrong'}</p>`;
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
<div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-xl">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">🔗 Shorty - URL Shortener</h1>
    <form onsubmit="shortenLink(event)" class="space-y-4">
        <div>
            <label for="urlInput" class="block text-sm font-medium text-gray-700 mb-1">Enter a long URL</label>
            <input
                    type="url"
                    id="urlInput"
                    class="w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="https://example.com"
                    required
            >
        </div>
        <button
                type="submit"
                class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-xl hover:bg-indigo-700 transition"
        >
            Shorten It
        </button>
    </form>
    <div id="result" class="mt-6 text-center text-sm"></div>
</div>
</body>
</html>
